[pytest]
addopts = --html=reports/report.html --self-contained-html -v --tb=short
testpaths = tests
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s %(levelname)-8s %(name)s | %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
markers =
    smoke: Smoke tests - fast sanity checks
    regression: Full regression suite
    login: Login and authentication tests
    signup: User registration tests
    product: Product listing and search tests
    cart: Shopping cart tests
